    .entrada__veu {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 55% 45% at 50% 48%, rgba(20, 35, 59, 0.45) 0%, transparent 75%),
        linear-gradient(180deg, rgba(20, 35, 59, 0.35) 0%, rgba(20, 35, 59, 0.2) 40%, rgba(20, 35, 59, 0.85) 100%);
    }

    .entrada__conteudo {
      align-self: center;
      justify-self: center;
      width: min(100%, 72rem);
      padding: 4rem 1rem 2rem;
      text-align: center;
    }

    .entrada__nomes {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.5rem, 3.2vw, 2.25rem);
      letter-spacing: 0.01em;
      color: var(--nevoa);
    }

    .entrada__ra {
      font-family: var(--font-texto);
      font-style: normal;
      font-weight: 300;
      font-size: 0.55em;
      letter-spacing: 0.06em;
      opacity: 0.8;
    }

    .entrada__e {
      font-style: normal;
      color: var(--rose);
      padding: 0 0.25em;
    }

    /* ---------- Contador ---------- */
    .contador { margin-top: clamp(0.5rem, 2vh, 1.5rem); }

    .contador__dias {
      font-family: var(--font-display);
      font-weight: 400;
      font-variant-numeric: lining-nums tabular-nums;
      font-size: clamp(9rem, 40vw, 24rem);
      line-height: 0.82;
      letter-spacing: -0.03em;
      color: var(--branco);
      text-shadow: 0 0.04em 0.4em rgba(20, 35, 59, 0.35);
      opacity: 0;
      transform: translateY(0.08em);
      transition: opacity 1.4s ease 0.3s, transform 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.3s;
    }

    .contador__resto {
      margin-top: clamp(1rem, 3vh, 2rem);
      min-height: 1.6em;
      font-size: clamp(1rem, 2.1vw, 1.3rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      color: var(--nevoa);
      opacity: 0;
      transition: opacity 1s ease 1.1s;
    }

    .contador--pronto .contador__dias { opacity: 1; transform: none; }
    .contador--pronto .contador__resto { opacity: 1; }

    .contador__chegou {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(3rem, 10vw, 7rem);
      line-height: 1;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .segundos { color: var(--branco); }

    /* ---------- Data ---------- */
    .entrada__data {
      margin-top: clamp(2rem, 6vh, 3.5rem);
      display: grid;
      justify-items: center;
      gap: 0.75rem;
    }

    .entrada__ramo { width: min(15rem, 70vw); height: auto; }

    .entrada__data p {
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      color: var(--branco);
    }

    .entrada__data p::first-letter { text-transform: uppercase; }

    /* ---------- Botão para o site real ---------- */
    .entrada__botao {
      display: inline-block;
      margin-top: clamp(1.75rem, 5vh, 2.75rem);
      padding: 0.8rem 2rem;
      border: 1px solid var(--rose);
      border-radius: 999px;
      color: var(--branco);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      background: rgba(20, 35, 59, 0.35);
      backdrop-filter: blur(6px);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .entrada__botao:hover,
    .entrada__botao:focus-visible {
      background: var(--rose);
      color: var(--marinho);
    }

    /* ---------- Rodapé do TP ---------- */
    .entrada__rodape {
      padding: 0 1rem 1.75rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(214, 219, 225, 0.7);
    }

    @keyframes foco {
      from { filter: blur(48px) saturate(0.6); transform: scale(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      .entrada__fundo { animation: none; }
      .contador__dias, .contador__resto { transition: none; transform: none; }
    }
  </style>
</head>

        </h1>

        <div id="contador" class="contador">

          <p class="contador__resto" id="resto">&nbsp;</p>

        <div class="entrada__data">

  <script>
    // Horário da cerimônia (fuso de Brasília).
    const ALVO = new Date("2027-07-09T18:00:00-03:00");
    const FIM_DO_DIA = new Date("2027-07-09T23:59:59-03:00");
    const DIA_MS = 86400000;

    const contador = document.getElementById("contador");
    const elDias = document.getElementById("dias");
    const elResto = document.getElementById("resto");

    // ?previa=grande-dia permite ver a comemoração antes da data.
    const previa = new URLSearchParams(location.search).get("previa");

    const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

    function tick() {
      const agora = new Date();
      const diff = ALVO - agora;

      if (previa === "grande-dia" || (diff <= 0 && agora <= FIM_DO_DIA)) {
        contador.innerHTML = '<p class="contador__chegou">Chegou o grande dia</p>';
        contador.classList.add("contador--pronto");
        clearInterval(id);
        return;
      }

      if (diff <= 0) {
        const dias = Math.floor((agora - ALVO) / DIA_MS);
        elDias.textContent = dias;
        elResto.textContent = `${dias === 1 ? "dia" : "dias"} de casados`;
        contador.classList.add("contador--pronto");
        return;
      }

      const total = Math.floor(diff / 1000);
      const dias = Math.floor(total / 86400);
      const horas = Math.floor((total % 86400) / 3600);
      const minutos = Math.floor((total % 3600) / 60);
      const segundos = total % 60;

      elDias.textContent = dias;
      elDias.removeAttribute("aria-hidden");
      elResto.innerHTML =
        `${dias === 1 ? "dia" : "dias"}, ` +
        `<span class="tabular">${plural(horas, "hora", "horas")}</span>, ` +
        `<span class="tabular">${plural(minutos, "minuto", "minutos")}</span> e ` +
        `<span class="tabular segundos">${plural(segundos, "segundo", "segundos")}</span>`;
      contador.classList.add("contador--pronto");
    }

    const id = setInterval(tick, 1000);
    tick();
  </script>
